spring:
  application:
    name: emp-verify-backend

  datasource:
    # 127.0.0.1 (not localhost): avoids IPv6 ::1 resolution hitting unrelated listeners
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:empverify}
    username: ${DB_USER:empverify}
    password: ${DB_PASSWORD:empverify}

  jpa:
    hibernate:
      ddl-auto: none # schema is owned by Flyway
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

empverify:
  # AWS region must support Rekognition Face Liveness:
  # us-east-1 | us-west-2 | eu-west-1 | ap-northeast-1 | ap-south-1
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${S3_BUCKET:}
    kms-key-id: ${KMS_KEY_ID:}

  # "stub" (local dev: no AWS needed) or "rekognition" (real matching).
  verifier: ${EMPVERIFY_VERIFIER:stub}
  stub-similarity: 95.0

  # "stub" (local dev) or "rekognition" (real Face Liveness).
  liveness: ${EMPVERIFY_LIVENESS:stub}
  # Base URL of the hosted React liveness page the agent opens in a browser.
  liveness-ui-url: ${LIVENESS_UI_URL:http://localhost:5174}
  # Minimum live-person confidence to accept; below this is treated as CHECK.
  liveness-threshold: ${LIVENESS_THRESHOLD:80}

  # "local" (dev: ./data/images) or "s3" (deploy).
  storage: ${EMPVERIFY_STORAGE:local}
  local-storage-dir: ${EMPVERIFY_STORAGE_DIR:./data/images}

  retention:
    evidence-days: ${EVIDENCE_RETENTION_DAYS:90}

  demo:
    # Enables POST /api/v1/admin/demo/reset, which wipes all demo data. Test env only.
    reset-enabled: ${DEMO_RESET_ENABLED:false}

  security:
    # Dev-only shared secrets; replaced by Cognito + managed secrets at deployment.
    admin-api-key: ${ADMIN_API_KEY:dev-admin-key}
    # Cognito user pool for admin sign-in (portal sends the ID token as a Bearer JWT).
    # Empty issuer = JWT auth off; dev falls back to the admin key.
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:}
      client-id: ${COGNITO_CLIENT_ID:}
    # Tenant provisioning token: a fresh install registers itself as UNASSIGNED with
    # it (set by the installer/MDM); an admin then links the device to an employee.
    # Empty = device-first provisioning disabled.
    provisioning-token: ${PROVISIONING_TOKEN:}
    device-token-secret: ${DEVICE_TOKEN_SECRET:dev-device-token-secret-change-me}
    device-token-ttl-seconds: 3600
    enrollment-token-ttl-hours: 24

  verification:
    # Similarity >= match-threshold  -> MATCH
    # review-threshold..match-threshold -> CHECK
    # < review-threshold             -> CHECK with mismatch flag
    # (per-policy values in check_policies override at runtime)
    check-expiry-seconds: 120
    # The zone in which a work day is judged for the NO_CHECK record. The agent
    # applies the policy's window in the PC's local time; a fleet in one zone sets
    # that zone here (WORK_ZONE=America/New_York).
    zone: ${WORK_ZONE:UTC}
    # How often the server looks for employees whose systems opened no check today.
    no-check-sweep-ms: 300000
    # Judge Saturdays/Sundays too (the agent itself schedules checks every day).
    # Turned on for testing (WORK_WEEKENDS=true); off for normal operation.
    weekends: ${WORK_WEEKENDS:false}
