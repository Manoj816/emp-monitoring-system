name: Web CI (admin portal + liveness UI)

on:
  push:
    branches: [main]
    paths: ["admin-portal/**", "liveness-ui/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["admin-portal/**", "liveness-ui/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-portal, liveness-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Type-check and build
        working-directory: ${{ matrix.app }}
        run: npm run build

  # Hosting deploys are handled by AWS Amplify's GitHub integration once the
  # Amplify apps are connected to this repository (see infra/README.md).
