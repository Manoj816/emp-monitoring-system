name: Backend CI/CD

on:
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]

permissions:
  contents: read
  id-token: write # OIDC: lets this workflow assume the AWS deploy role without stored keys

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload jar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  deploy:
    # Activates once infra is bootstrapped: set AWS_DEPLOY_ROLE_ARN, AWS_REGION and
    # ECR_REPOSITORY as repository variables (Settings > Secrets and variables > Variables).
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to ECS (new task-def revision with the new image)
        run: |
          FAMILY="empverify-backend"
          CLUSTER="${{ vars.ECS_CLUSTER }}"
          SERVICE="${{ vars.ECS_SERVICE }}"

          # Take the current task definition, swap in the new image, drop the
          # read-only fields, and register a new revision.
          CURRENT=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition)
          NEW=$(echo "$CURRENT" | jq --arg IMG "$IMAGE" '
            .containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $NEW_ARN"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --force-new-deployment
          echo "Waiting for the service to stabilize..."
          aws ecs wait services-stable --cluster "$CLUSTER" --service "$SERVICE"
