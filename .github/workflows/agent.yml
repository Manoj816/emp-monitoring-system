name: Desktop Agent CI

on:
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths: ["desktop-agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["desktop-agent/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        working-directory: desktop-agent
        run: dotnet build -c Release

      - name: Test
        working-directory: desktop-agent
        run: dotnet test -c Release --no-build

  package:
    # Builds the MSIX on main. windows-latest already has the Windows SDK
    # (makeappx/signtool). Dev self-signed packaging validates the pipeline;
    # production signing uses a real certificate via repository secrets.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # No -Version: the package version is the one declared in AppxManifest.xml,
      # so what CI builds is what the repo says the version is.
      - name: Build MSIX (dev-signed)
        working-directory: desktop-agent/packaging
        shell: pwsh
        run: ./build-msix.ps1

      # The whole install bundle, not the bare .msix: on its own the package is
      # not installable without the trust certificate and the install scripts
      # that build-msix.ps1 zips alongside it.
      - name: Upload install bundle
        uses: actions/upload-artifact@v4
        with:
          name: empverify-agent-setup
          path: desktop-agent/packaging/out/EmpVerify-Agent-Setup_*.zip

      # Production signing (uncomment once the code-signing certificate exists;
      # store it as base64 in secrets, never in the repo):
      # - name: Decode signing certificate
      #   shell: pwsh
      #   run: |
      #     [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
      #       [Convert]::FromBase64String("${{ secrets.SIGNING_PFX_BASE64 }}"))
      # - name: Build MSIX (production-signed)
      #   working-directory: desktop-agent/packaging
      #   shell: pwsh
      #   run: ./build-msix.ps1 -PfxPath "$env:RUNNER_TEMP\cert.pfx" -PfxPassword (ConvertTo-SecureString "${{ secrets.SIGNING_PFX_PASSWORD }}" -AsPlainText -Force)
